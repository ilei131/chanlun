[package]
name = "chanlun-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web框架
actix-web = "4"
actix-rt = "2"

# 数据库 - 使用 sqlx
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# 环境配置
dotenv = "0.15"

# 日期时间
chrono = { version = "0.4", features = ["serde"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日志
log = "0.4"
env_logger = "0.10"

# HTTP 客户端（用于调用 tushare API）
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# 异步运行时
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# 其他
thiserror = "1"
futures = "0.3"
num = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

# CZSC 缠论核心库（通过 submodule 集成）
czsc-core = { path = "../vendor/czsc/crates/czsc-core", version = "1.0.0" }
czsc-utils = { path = "../vendor/czsc/crates/czsc-utils", version = "1.0.0" }
czsc-ta = { path = "../vendor/czsc/crates/czsc-ta", version = "1.0.0" }
czsc-signals = { path = "../vendor/czsc/crates/czsc-signals", version = "1.0.0" }
czsc-trader = { path = "../vendor/czsc/crates/czsc-trader", version = "1.0.0" }

# CZSC 依赖的第三方库
hashbrown = "0.14"
ordered-float = "5.0"
polars = { version = "0.42.0", features = ["lazy", "serde", "strings", "concat_str", "pivot", "is_in", "cum_agg", "abs", "ipc", "round_series", "dtype-datetime", "temporal", "parquet", "timezones", "fmt", "partition_by"] }
rayon = "1"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
codegen-units = 1
panic = "abort"
